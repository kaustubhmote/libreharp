[package]
name = "libreharp-weir"
version = "0.1.0"
edition = "2024"
license = "0BSD"
publish = false

[dependencies]
harper-core = { git = "https://github.com/Automattic/harper.git", rev = "d52aeac0a6de1cdb030b231705ab7e7e4e12e197", default-features = false, features = ["concurrent"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
