[package]
name = "libreharp-weir"
version = "0.1.0"
edition = "2024"
license = "0BSD"
publish = false

[dependencies]
harper-core = { git = "https://github.com/Automattic/harper.git", rev = "ea9ab1b8f95be99a5d4040c53be92a6c2ad7f7f3", default-features = false, features = ["concurrent"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
