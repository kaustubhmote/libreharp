[package]
name = "libreharp-weir"
version = "0.1.0"
edition = "2024"
license = "0BSD"
publish = false

[dependencies]
harper-core = { git = "https://github.com/Automattic/harper.git", rev = "8ad653e68d1dd4a809b3d1124249cad8573a4731", default-features = false, features = ["concurrent"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
